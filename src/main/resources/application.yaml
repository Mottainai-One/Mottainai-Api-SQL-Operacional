spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mottainai

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: mottainai
        format_sql: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@mottainai.local}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true

  flyway:
    enabled: false
    schemas: mottainai
    default-schema: mottainai
    create-schemas: true
    locations: classpath:db/migration

security:
  password:
    predictable-terms: ${PREDICTABLE_PASSWORD_TERMS:mottainai,2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}
    issuer: https://mottainai.local
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  staff:
    password-reset-url: ${STAFF_PASSWORD_RESET_URL:http://localhost:3000/reset-password}
    data:
      encryption-key: ${STAFF_DATA_ENCRYPTION_KEY:}
      key-version: ${STAFF_DATA_KEY_VERSION:1}
      decryption-keys: ${STAFF_DATA_DECRYPTION_KEYS:}
      lookup-key: ${STAFF_DATA_LOOKUP_KEY:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
